name: build-luau
on: workflow_dispatch
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ make
      - run: cd engine && python3 build_luau.py --portable && ls -la bin
      - run: |
          git config user.name github-actions && git config user.email actions@github.com
          git add -f engine/bin/luau engine/bin/luau-ast
          git commit -m "Add Linux luau binaries" && git push
