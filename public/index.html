<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luraph Deobfuscator</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--mut:#78716c;--card:#fff;--bd:#e7e5e4;--ac:#4f46e5;--acfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0c0a09;--fg:#f5f5f4;--mut:#a8a29e;--card:#1c1917;--bd:#292524;--ac:#818cf8;--acfg:#0c0a09}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px}h1{font-size:22px;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
select,button,label.f{font:inherit;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600}button:disabled{opacity:.5;cursor:wait}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.g{grid-template-columns:1fr}}
textarea,pre{width:100%;height:420px;margin:0;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;overflow:auto;resize:vertical;white-space:pre}
pre.l{height:auto;max-height:180px;color:var(--mut);white-space:pre-wrap}h2{font-size:13px;color:var(--mut);margin:0 0 6px;font-weight:600}
</style></head><body><main>
<h1>Luraph Deobfuscator</h1><p class="s">Paste or upload a Luraph v14.7–v15 script. Only use it on code you own or are authorized to analyze.</p>
<div class="row">
<select id="eng"><option value="auto">Auto-detect</option><option value="v15">Luraph v15</option><option value="14.9">Luraph v14.9</option><option value="14.8">Luraph v14.8</option><option value="14.7">Luraph v14.7</option></select>
<label><input type="checkbox" id="dv" checked> Full devirtualization (slower)</label>
<label class="f">Upload .lua<input type="file" id="fi" accept=".lua,.luau,.txt" hidden></label>
<button class="p" id="go">Deobfuscate</button></div>
<div class="g"><div><h2>Input</h2><textarea id="in" spellcheck="false" placeholder="-- paste obfuscated script"></textarea></div>
<div><h2>Output</h2><pre id="out"></pre>
<div class="row"><button id="cp">Copy</button><button id="dl">Download</button></div></div></div>
<pre class="l" id="log"></pre></main>
<script>
const $=i=>document.getElementById(i);let res="";
$("fi").onchange=async e=>{const f=e.target.files[0];if(f)$("in").value=new TextDecoder("latin1").decode(await f.arrayBuffer())};
$("go").onclick=async()=>{const b=$("go");b.disabled=true;b.textContent="Running… (can take minutes)";$("out").textContent="";$("log").textContent="";
try{const r=await fetch("/api/deobfuscate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:$("in").value,engine:$("eng").value,devirt:$("dv").checked})});
const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={ok:false,error:"HTTP "+r.status+": "+t.slice(0,300)}}
res=j.ok?j.output:"";$("out").textContent=j.ok?j.output:"✖ "+(j.error||"failed");$("log").textContent=j.log||""}
catch(e){$("out").textContent="✖ "+e}b.disabled=false;b.textContent="Deobfuscate"};
$("cp").onclick=()=>navigator.clipboard.writeText(res);
$("dl").onclick=()=>{if(!res)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([res],{type:"text/plain"}));a.download="deobfuscated.lua";a.click()};
</script></body></html>
